apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "app.eqdownload"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.eqdownload.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "0.1.19"
        // arm64 only keeps the APK small (python + ffmpeg ship per ABI).
        ndk { abiFilters 'arm64-v8a' }
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        // youtubedl-android runs python and ffmpeg from the native library directory, so they must be extracted.
        jniLibs { useLegacyPackaging = true }
    }
    testOptions {
        unitTests.all {
            // ManifestTest also checks the merged manifest of the variant under test.
            systemProperty 'eq.mergedManifest', layout.buildDirectory.get().asFile.toString()
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // yt-dlp for Android (maintained fork of yausername/youtubedl-android), pinned.
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroidVersion"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroidVersion"
    // aria2c splits each file into parallel connections (the download-manager trick); optional at run time.
    implementation "io.github.junkfood02.youtubedl-android:aria2c:$youtubedlAndroidVersion"
    // Already a dependency of Capacitor; MainActivity asks it whether the web view can run the bridge.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
}

apply from: 'capacitor.build.gradle'

// ManifestTest reads the merged manifest, so it has to exist before the unit tests run.
tasks.configureEach { t ->
    if (t.name == 'testDebugUnitTest') t.dependsOn('processDebugManifest')
}
