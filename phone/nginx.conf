# Termux nginx: ~/../usr/etc/nginx/nginx.conf. Two sites, plain HTTP on high ports; cloudflared adds HTTPS.
worker_processes 1;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    server_tokens off;

    # ---- openGYM -> gym.eqqx2.com ----
    server {
        listen 8080;
        root /data/data/com.termux/files/home/gym/dist;   # built frontend (see README)
        index index.html;
        absolute_redirect off;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xUZtZS1nWJaAyUqA7ZKgkLhjdEisnY0MiRmax16aGFg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location ^~ /exercise-media/ {
            alias /data/data/com.termux/files/home/gym/exercise-media/;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /index.html { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xUZtZS1nWJaAyUqA7ZKgkLhjdEisnY0MiRmax16aGFg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: http:; worker-src 'self'; manifest-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always; }
        location = /sw.js { add_header Cache-Control "no-cache"; }

        location ^~ /api/media/ {
            client_max_body_size 48m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
        location ^~ /api/ {
            client_max_body_size 5m;
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
        location / { try_files $uri $uri/ /index.html; }
    }

    # ---- EqDownload -> downloader.eqqx2.com ----
    server {
        listen 8081;
        root /data/data/com.termux/files/home/eq/site;
        index index.html;
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        # Browsers must recheck page files on every visit (cheap: ETag), or an old site.js hides new options.
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
        }
        location = /sw.js { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri.html $uri/ =404; }   # vercel.json cleanUrls
    }
}
