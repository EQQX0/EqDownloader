name: Phone uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check phone-hosted services
        env:
          NTFY_TOPIC: eqqx2-s21-0a3a7a6d6d07
        run: |
          # Up = any response below 500. nginx returns 502 when its backend is down,
          # and Cloudflare returns 530 when the tunnel is down.
          fail=""
          for url in https://downloader.eqqx2.com/api/probe https://gym.eqqx2.com/api/; do
            code=$(curl -s -o /dev/null -m 20 --retry 2 --retry-delay 5 -w '%{http_code}' "$url" || echo 000)
            echo "$url -> $code"
            if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then fail="$fail $url($code)"; fi
          done
          if [ -n "$fail" ]; then
            curl -s -H "Title: S21 services down" -H "Priority: urgent" -H "Tags: warning" \
              -d "Failing:$fail" "https://ntfy.sh/$NTFY_TOPIC"
            exit 1
          fi
